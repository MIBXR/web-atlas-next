<!doctype html>
<meta charset="utf-8">
<title>跳转到文档</title>
<script>
  var f = new URLSearchParams(location.search).get("file");
  var q = new URLSearchParams();
  if (f) q.set("path", f);
  if (location.hash) q.set("h", decodeURIComponent(location.hash.slice(1)));
  location.replace("./#/docs" + (q.size ? "?" + q : ""));
</script>
