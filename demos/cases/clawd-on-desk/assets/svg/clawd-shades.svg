<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <!-- Clawd "Deal with it" 彩蛋定格版 (M2.4g)
       源：clawd-test/experiments/shades/clawd-experiment-put-on-v4.svg (8s 循环)
       改动：截断到原 55%（sparkle-far 散完，回纯 cool pose），所有 keyframes 百分比按 1/0.55 重映射
       duration: 8s → 4.4s · iteration: infinite → 1 · 加 fill-mode: forwards 定格
       定格画面：戴墨镜 + 双手 cool pose 外展 + mood 微微 tilt · 无闪光 -->

  <defs>
    <style>
      .arm-right-motion {
        transform-origin: 13px 10px;
        animation: arm-right 4.4s ease-in-out 1 forwards;
      }
      .arm-left-motion {
        transform-origin: 2px 10px;
        animation: arm-left 4.4s ease-in-out 1 forwards;
      }
      .glasses-fly {
        transform-origin: 0 0;
        animation: glasses-fly 4.4s ease-in-out 1 forwards;
      }
      .mood {
        transform-origin: 7.5px 13px;
        animation: mood 4.4s ease-in-out 1 forwards;
      }
      .shadow-fade {
        animation: shadow-fade 4.4s ease-in-out 1 forwards;
      }
      .sparkle-near {
        transform-origin: 2.5px 6.5px;
        animation: sparkle-near 4.4s ease-in-out 1 forwards;
      }
      .sparkle-far {
        transform-origin: 3.5px 4.5px;
        animation: sparkle-far 4.4s ease-in-out 1 forwards;
      }

      /* 右手 (原 0-55% 重映射): idle → 举顶 → hold → cool pose (定格) */
      @keyframes arm-right {
        0%, 9%      { transform: none; }
        14.5%, 32.7% { transform: translateY(-3px) rotate(-90deg); }
        45.5%, 72.7% { transform: translate(-1px, -1px); }
        81.8%, 100%  { transform: translate(0.5px, 1px); }
      }

      /* 左手 (原 0-55% 重映射): idle → hold → cool pose (定格) */
      @keyframes arm-left {
        0%, 27.3%    { transform: none; }
        45.5%, 72.7% { transform: translate(1px, -1px); }
        81.8%, 100%  { transform: translate(-0.5px, 1px); }
      }

      /* 墨镜 (原 0-55% 重映射 · 原 70% 展示末端截断到 100%)
         飞入 → 召唤 → 飞脸 → 展示 (定格 opacity 1 · scale 0.65) */
      @keyframes glasses-fly {
        0%, 14.5%    { transform: translate(10.15px, 3.25px) scale(0.3); opacity: 0; }
        21.8%, 32.7% { transform: translate(10.15px, 3.25px) scale(0.3); opacity: 1; }
        54.5%, 100%  { transform: translate(1.325px, 7.375px) scale(0.65); opacity: 1; }
      }

      /* 外层 mood (原 0-55% 重映射): 摇头 → cool tilt (定格 1deg) */
      @keyframes mood {
        0%, 54.5%    { transform: rotate(0deg); }
        60%          { transform: rotate(1deg); }
        65.5%        { transform: rotate(-1deg); }
        72.7%        { transform: rotate(0deg); }
        81.8%, 100%  { transform: rotate(1deg); }
      }

      /* 双手阴影 opacity (原 0-55% 重映射): 手 hold 阶段显示 · cool pose 期间隐藏 (定格 0) */
      @keyframes shadow-fade {
        0%, 40%      { opacity: 0; }
        50.9%, 76.4% { opacity: 1; }
        87.3%, 100%  { opacity: 0; }
      }

      /* 第 1 次闪 (near, 小, 原 41-44% → 74.5-80%): 戴好摇头后的定妆闪 · 到 55% 已散 (定格 0) */
      @keyframes sparkle-near {
        0%, 72.7%   { opacity: 0; transform: scale(0.4); }
        74.5%       { opacity: 1; transform: scale(0.7); }
        78.2%       { opacity: 0.7; transform: scale(0.5); }
        80%, 100%   { opacity: 0; transform: scale(0.4); }
      }

      /* 第 2 次闪 (far, 大, 原 48-53% → 87.3-96.4%): cool pose 虚空爆闪 · 到 55% 已散 (定格 0) */
      @keyframes sparkle-far {
        0%, 83.6%   { opacity: 0; transform: scale(0.5); }
        87.3%       { opacity: 1; transform: scale(1.4); }
        90.9%       { opacity: 0.9; transform: scale(1.2); }
        96.4%, 100% { opacity: 0; transform: scale(0.6); }
      }
    </style>

    <clipPath id="inside-torso">
      <rect x="2" y="6" width="11" height="7"/>
    </clipPath>
  </defs>

  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g class="mood">
    <g id="master-group">

      <!-- 腿 (静止) -->
      <g id="legs" fill="#DE886D">
        <rect x="3"  y="13" width="1" height="2"/>
        <rect x="5"  y="13" width="1" height="2"/>
        <rect x="9"  y="13" width="1" height="2"/>
        <rect x="11" y="13" width="1" height="2"/>
      </g>

      <!-- torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- 双手 L 形凹陷阴影 -->
      <g clip-path="url(#inside-torso)" class="shadow-fade">
        <g class="arm-left-motion">
          <rect x="0" y="9" width="2.4" height="2.4" fill="#A85A3A"/>
        </g>
        <g class="arm-right-motion">
          <rect x="12.6" y="9" width="2.4" height="2.4" fill="#A85A3A"/>
        </g>
      </g>

      <!-- 眼睛 -->
      <g fill="#000000">
        <rect x="4"  y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- 墨镜 (眼睛之上, 手之下) -->
      <g class="glasses-fly">
        <g fill="#000000">
          <rect x="0"  y="0" width="19" height="1"/>
          <rect x="0"  y="1" width="8"  height="1"/>
          <rect x="11" y="1" width="8"  height="1"/>
          <rect x="0"  y="2" width="8"  height="1"/>
          <rect x="11" y="2" width="8"  height="1"/>
          <rect x="1"  y="3" width="6"  height="1"/>
          <rect x="12" y="3" width="6"  height="1"/>
          <rect x="2"  y="4" width="4"  height="1"/>
          <rect x="13" y="4" width="4"  height="1"/>
        </g>
        <g fill="#FFFFFF">
          <rect x="5"  y="1" width="1" height="1"/>
          <rect x="4"  y="2" width="1" height="1"/>
          <rect x="16" y="1" width="1" height="1"/>
          <rect x="15" y="2" width="1" height="1"/>
        </g>
      </g>

      <!-- 左手 (最顶层, 盖墨镜左端) -->
      <g class="arm-left-motion">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- 右手 (最顶层, 盖墨镜右端) -->
      <g class="arm-right-motion">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- ★ 第 1 次闪 (near, 小, 贴墨镜左上角) -->
      <g class="sparkle-near" fill="#FFFFFF">
        <rect x="2" y="6" width="1" height="1"/>
        <rect x="2" y="5" width="1" height="1"/>
        <rect x="2" y="7" width="1" height="1"/>
        <rect x="1" y="6" width="1" height="1"/>
        <rect x="3" y="6" width="1" height="1"/>
      </g>

      <!-- ★ 第 2 次闪 (far, 大, 脸左上虚空) -->
      <g class="sparkle-far" fill="#FFFFFF">
        <rect x="3" y="4" width="1" height="1"/>
        <rect x="3" y="3" width="1" height="1"/>
        <rect x="3" y="5" width="1" height="1"/>
        <rect x="2" y="4" width="1" height="1"/>
        <rect x="4" y="4" width="1" height="1"/>
      </g>

    </g>
  </g>
</svg>
