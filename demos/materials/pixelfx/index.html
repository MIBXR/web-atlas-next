<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>pixelfx · 像素特效画廊</title>
<meta name="description" content="244 个像素特效，每一个都是一小段代码。实时播放、换配色、换种子，导出透明雪碧图。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../site/runtime/demo-scrollbars.css">
<link rel="stylesheet" href="demo/style.css">
</head>
<body>
<!--BODY-->
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub"><span id="count">0</span> 个像素特效，每一个都是一小段代码。</p>
    </div>
  </div>
  <nav class="links">
    <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">github</a>
    <a href="https://github.com/patch-gg/pixelfx#the-skill" target="_blank" rel="noopener">claude code skill</a>
    <a href="https://patch.gg" target="_blank" rel="noopener">patch.gg</a>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="toolbar" aria-label="分类"></div>
    <input id="q" type="search" placeholder="搜索" aria-label="搜索效果" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" hidden>没有匹配的效果。试试 fire、slash 或 loop。</p>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big"><canvas id="big"></canvas><button class="close" id="d-close" type="button">关闭</button></div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="id" id="d-id"></div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <div class="controls">
        <div class="row"><label>播放</label><button class="btn" id="d-play" type="button">暂停</button><button class="btn" id="d-again" type="button">重播</button><span id="d-speed" class="row"></span></div>
        <div class="row"><label>背景</label><span id="d-bg" class="row"></span></div>
        <div class="row"><label>配色</label><select class="btn" id="d-pal" aria-label="配色方案"></select><button class="btn" id="d-seed" type="button">换种子</button></div>
        <div class="row"><label>显示</label><button class="btn" id="d-flip" type="button">镜像</button><button class="btn" id="d-actor" type="button">角色</button><button class="btn" id="d-make" type="button">雪碧图</button></div>
      </div>
      <div class="code-head"><span>使用</span><span><a id="d-src" target="_blank" rel="noopener">源码</a> · <button class="btn" id="d-copy" type="button">复制</button></span></div>
      <pre id="d-code"></pre>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>
<!--/BODY-->
<script type="module" src="demo/app.js"></script>
</body>
</html>
